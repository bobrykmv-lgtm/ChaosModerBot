name: Node.js CI & Build Artifact

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: 📥 Клонування репозиторію
      uses: actions/checkout@v4

    - name: ⚙️ Встановлення Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: 📦 Встановлення залежностей (npm install)
      run: npm install

    - name: 🗂️ Запакування проєкту в архів
      run: |
        mkdir -p dist
        # Копіюємо всі важливі файли у папку збірки
        cp assistant.js package.json dist/
        cp -r node_modules dist/

    - name: 📤 Збереження артефакту (готової збірки)
      uses: actions/upload-artifact@v4
      with:
        name: ai-admin-assistant-build
        path: dist/
